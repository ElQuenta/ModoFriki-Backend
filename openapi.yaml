          minimum: 0
        readsLast7Days:
          type: integer
          minimum: 0
        readsLast30Days:
          type: integer
          minimum: 0
        currentStreak:
          type: integer
          minimum: 0
        longestStreak:
          type: integer
          minimum: 0
        lastReadingDate:
          type: string
          format: date
