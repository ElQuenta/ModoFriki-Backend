            $ref: "#/components/schemas/PopularWork"
    PopularWorkPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PopularWork"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
    SuccessEnvelope:
      type: object
      required: [success, code, data]
      properties:
        success: { type: boolean, enum: [true] }
        code: { type: integer }
        data: {}
    User:
      type: object
      additionalProperties: false
      required: [id, email, username, role, timezone, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
    Votes:
      type: object
      required: [upvotes, downvotes, score]
      properties:
        upvotes: { type: integer, minimum: 0 }
        downvotes: { type: integer, minimum: 0 }
        score: { type: integer }
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, targetType, targetId, parentCommentId, rootCommentId, bodyMarkdown, status, revision, createdAt, editedAt, votes]
      properties:
        id: { type: string, format: uuid }
        author:
          type: object
          nullable: true
          required: [id, username]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
        targetType: { type: string, enum: [WORK, CHAPTER] }
        targetId: { type: string, format: uuid }
        parentCommentId: { type: string, format: uuid, nullable: true }
        rootCommentId: { type: string, format: uuid }
        bodyMarkdown: { type: string, nullable: true, maxLength: 10000 }
        status: { type: string, enum: [ACTIVE, DELETED] }
        revision: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        votes: { $ref: '#/components/schemas/Votes' }
    CursorPage:
      type: object
      required: [items, hasMore, nextCursor]
      properties:
        items: { type: array, items: {} }
        hasMore: { type: boolean }
        nextCursor:
          type: object
          nullable: true
          required: [createdAt, id]
          properties:
            createdAt: { type: string, format: date-time }
            id: { type: string, format: uuid }
    Report:
      type: object
      required: [id, commentId, reason, details, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        commentId: { type: string, format: uuid }
        reason: { type: string, enum: [SPAM, HARASSMENT, HATE, SPOILER, OTHER] }
        details: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] }
        createdAt: { type: string, format: date-time }
    ModerationReport:
      allOf:
        - { $ref: '#/components/schemas/Report' }
        - type: object
          required: [reporterId, reviewedById, reviewedAt, resolution, updatedAt]
          properties:
            reporterId: { type: string, format: uuid }
            reviewedById: { type: string, format: uuid, nullable: true }
            reviewedAt: { type: string, format: date-time, nullable: true }
            resolution: { type: string, nullable: true }
            updatedAt: { type: string, format: date-time }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, role, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminAssignment:
      type: object
      additionalProperties: false
      required: [id, workId, editorId, assignedById, assignedAt, createdAt, revokedAt, version]
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        editorId: { type: string, format: uuid }
        assignedById: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time, description: Cursor immutable de la primera asignación }
        revokedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, minimum: 1 }
    AdminCursor:
      type: object
      additionalProperties: false
      required: [createdAt, id]
      properties:
        createdAt: { type: string, format: date-time }
        id: { type: string, format: uuid }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, hasMore, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        hasMore: { type: boolean }
        nextCursor:
          allOf: [{ $ref: '#/components/schemas/AdminCursor' }]
          nullable: true
    AdminAssignmentPage:
      type: object
      additionalProperties: false
      required: [items, hasMore, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAssignment' } }
        hasMore: { type: boolean }
        nextCursor:
          allOf: [{ $ref: '#/components/schemas/AdminCursor' }]
          nullable: true
    ErrorResponse:
      type: object
      required: [success, code, error]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: integer
          example: 404
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Route not found
    PaginationMeta:
      type: object
      required: [total, page, limit]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
    Role:
      type: string
      enum: [BASIC, EDITOR, ADMIN]
    WorkType:
      type: string
      enum: [MANHWA, MANHUA, MANGA, NOVELA]
    WorkStatus:
      type: string
      enum: [ACTIVO, FINALIZADO, PAUSA]
    FavoriteStatus:
      type: string
      enum: [LEYENDO, POR_LEER, COMPLETADO, PAUSA]
  responses:
    CommentSanctionResult:
      description: Sanción concreta; revocación idempotente sin alterar una posterior
      content:
        application/json:
          schema:
            type: object
            required: [success, code, data]
            properties:
              success: { type: boolean, enum: [true] }
              code: { type: integer, enum: [200] }
              data: { $ref: '#/components/schemas/CommentSanction' }
    CommentSanctionCreated:
      description: Sanción y auditoría confirmadas atómicamente
      content:
        application/json:
          schema:
            type: object
            required: [success, code, data]
            properties:
              success: { type: boolean, enum: [true] }
              code: { type: integer, enum: [201] }
              data: { $ref: '#/components/schemas/CommentSanction' }
    AdminUserResult:
      description: Cuenta administrativa sin email, normalizados ni credenciales
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/AdminUser' } }
    AdminUserPage:
      description: Página por createdAt e id de cuentas no eliminadas
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/AdminUserPage' } }
    AdminAssignmentResult:
      description: Relación versionada; assignedAt cambia al reasignar y createdAt permanece estable
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/AdminAssignment' } }
    AdminAssignmentPage:
      description: Página por createdAt e id de asignaciones editoriales
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/AdminAssignmentPage' } }
    AuthResult:
      description: Identidad pública y JWT HS256 válido siete días
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties:
                  data:
                    type: object
                    required: [user, token]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
    CommentResult:
      description: Comentario público, sin metadatos privados
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/Comment' } }
    CommentPage:
      description: Página plana de comentarios, orden ascendente createdAt e id
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/CursorPage' }
                      - properties: { items: { type: array, items: { $ref: '#/components/schemas/Comment' } } }
    ReportResult:
      description: Sólo el reporte recién creado por el actor
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/Report' } }
    BadRequest:
      description: Body, params o query inválidos, o JSON malformado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 400
            error:
              message: 'Validation error: "email" is required'
    Unauthorized:
      description: Falta el token o es inválido o expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 401
            error:
              message: Authentication required
    Forbidden:
      description: El usuario no tiene el rol requerido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 403
            error:
              message: Insufficient permissions
    NotFound:
      description: El recurso o la ruta no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 404
            error:
              message: Route not found
    Conflict:
      description: Recurso duplicado (email, username o slug)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 409
            error:
              message: Email already in use
    ServiceUnavailable:
      description: Persistencia administrativa temporalmente no disponible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 503
            error:
              message: Administrative persistence unavailable
