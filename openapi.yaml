components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CursorCreatedAt:
      name: cursorCreatedAt
      in: query
      description: ISO UTC, junto con cursorId o ambos ausentes
      schema: { type: string, format: date-time }
    CursorId:
      name: cursorId
      in: query
      schema: { type: string, format: uuid }
    CursorLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    ReadingEventInput:
      type: object
      properties:
        idempotencyKey:
          type: string
          format: uuid
      required:
        - idempotencyKey
      additionalProperties: false
    ReadingEvent:
      type: object
      properties:
        counted:
          type: boolean
        occurredAt:
          type: string
          format: date-time
        isRead:
          type: boolean
    ReadingReadState:
      type: object
      properties:
        chapterId:
          type: string
          format: uuid
        isRead:
          type: boolean
        firstReadAt:
          type: string
          format: date-time
        lastReadAt:
          type: string
          format: date-time
    ReadingWorkSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        coverUrl:
          type: string
          nullable: true
    ReadingFavorite:
      type: object
      properties:
        work:
          $ref: "#/components/schemas/ReadingWorkSummary"
        createdAt:
          type: string
          format: date-time
    ReadingFavoriteStatus:
      type: object
      properties:
        workId:
          type: string
          format: uuid
        isFavorite:
          type: boolean
    ReadingFavoritePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReadingFavorite"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
    ReadingRatingInput:
      type: object
      properties:
        score:
          type: number
          minimum: 0
          maximum: 5
          multipleOf: 0.5
      required:
        - score
      additionalProperties: false
    ReadingRating:
      type: object
      properties:
        workId:
          type: string
          format: uuid
        score:
          type: number
          nullable: true
          minimum: 0
          maximum: 5
    ReadingHistoryItem:
      type: object
      properties:
        chapterId:
          type: string
          format: uuid
        isRead:
          type: boolean
        firstReadAt:
          type: string
          format: date-time
        lastReadAt:
          type: string
          format: date-time
        work:
          $ref: "#/components/schemas/ReadingWorkSummary"
        chapter:
          type: object
          properties:
            id:
              type: string
              format: uuid
            number:
              type: string
            title:
              type: string
              nullable: true
    ReadingHistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReadingHistoryItem"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
    ReadingProgressChapter:
      type: object
      properties:
        chapterId:
          type: string
          format: uuid
        isRead:
          type: boolean
        firstReadAt:
          type: string
          format: date-time
          nullable: true
        lastReadAt:
          type: string
          format: date-time
          nullable: true
        number:
          type: string
        title:
          type: string
          nullable: true
    ReadingProgress:
      type: object
      properties:
        workId:
          type: string
          format: uuid
        isFavorite:
          type: boolean
        score:
          type: number
          nullable: true
        totalChapters:
          type: integer
          minimum: 0
        readChapters:
          type: integer
          minimum: 0
        completionPercentage:
          type: number
          minimum: 0
          maximum: 100
        chapters:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReadingProgressChapter"
            total:
              type: integer
              minimum: 0
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
    ReadingCalendar:
      type: object
      properties:
        timezone:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              chaptersRead:
                type: integer
                minimum: 0
    ReadingStats:
      type: object
      properties:
        markedReadChapters:
          type: integer
          minimum: 0
        favorites:
          type: integer
          minimum: 0
        recordedReads:
          type: integer
          minimum: 0
        activeDays:
          type: integer
          minimum: 0
        readsToday:
          type: integer
          minimum: 0
        readsLast7Days:
          type: integer
          minimum: 0
        readsLast30Days:
          type: integer
          minimum: 0
        currentStreak:
          type: integer
          minimum: 0
        longestStreak:
          type: integer
          minimum: 0
        lastReadingDate:
          type: string
          format: date
          nullable: true
        timezone:
          type: string
    ReadingWorkStats:
      type: object
      properties:
        workId:
          type: string
          format: uuid
        visits:
          type: integer
          minimum: 0
        visitsLast24Hours:
          type: integer
          minimum: 0
        reads:
          type: integer
          minimum: 0
        readsLast24Hours:
          type: integer
          minimum: 0
        favorites:
          type: integer
          minimum: 0
        ratings:
          type: integer
          minimum: 0
        averageRating:
          type: number
          nullable: true
          minimum: 0
          maximum: 5
    WorkRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        coverUrl:
          type: string
          nullable: true
    LatestChapter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        number:
          type: string
          description: Decimal serializado
        title:
          type: string
          nullable: true
        kind:
          type: string
          enum: [NORMAL, EXTRA, ANNOUNCEMENT]
        publishedAt:
          type: string
          format: date-time
        work:
          $ref: "#/components/schemas/WorkRef"
    LatestChapterPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LatestChapter"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
    SuccessEnvelope:
      type: object
      required: [success, code, data]
      properties:
        success: { type: boolean, enum: [true] }
        code: { type: integer }
        data: {}
    User:
      type: object
      additionalProperties: false
      required: [id, email, username, role, timezone, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
    Votes:
      type: object
      required: [upvotes, downvotes, score]
      properties:
        upvotes: { type: integer, minimum: 0 }
        downvotes: { type: integer, minimum: 0 }
        score: { type: integer }
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, targetType, targetId, parentCommentId, rootCommentId, bodyMarkdown, status, revision, createdAt, editedAt, votes]
      properties:
        id: { type: string, format: uuid }
        author:
          type: object
          nullable: true
          required: [id, username]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
        targetType: { type: string, enum: [WORK, CHAPTER] }
        targetId: { type: string, format: uuid }
        parentCommentId: { type: string, format: uuid, nullable: true }
        rootCommentId: { type: string, format: uuid }
        bodyMarkdown: { type: string, nullable: true, maxLength: 10000 }
        status: { type: string, enum: [ACTIVE, DELETED] }
        revision: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        votes: { $ref: '#/components/schemas/Votes' }
    CursorPage:
      type: object
      required: [items, hasMore, nextCursor]
      properties:
        items: { type: array, items: {} }
        hasMore: { type: boolean }
        nextCursor:
          type: object
          nullable: true
          required: [createdAt, id]
          properties:
            createdAt: { type: string, format: date-time }
            id: { type: string, format: uuid }
    Report:
      type: object
      required: [id, commentId, reason, details, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        commentId: { type: string, format: uuid }
        reason: { type: string, enum: [SPAM, HARASSMENT, HATE, SPOILER, OTHER] }
        details: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] }
        createdAt: { type: string, format: date-time }
    ModerationReport:
      allOf:
        - { $ref: '#/components/schemas/Report' }
        - type: object
          required: [reporterId, reviewedById, reviewedAt, resolution, updatedAt]
          properties:
            reporterId: { type: string, format: uuid }
            reviewedById: { type: string, format: uuid, nullable: true }
            reviewedAt: { type: string, format: date-time, nullable: true }
            resolution: { type: string, nullable: true }
            updatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [success, code, error]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: integer
          example: 404
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Route not found
    PaginationMeta:
      type: object
      required: [total, page, limit]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
    Role:
      type: string
      enum: [BASIC, EDITOR, ADMIN]
    WorkType:
      type: string
      enum: [MANHWA, MANHUA, MANGA, NOVELA]
    WorkStatus:
      type: string
      enum: [ACTIVO, FINALIZADO, PAUSA]
    FavoriteStatus:
      type: string
      enum: [LEYENDO, POR_LEER, COMPLETADO, PAUSA]
  responses:
    AuthResult:
      description: Identidad pública y JWT HS256 válido siete días
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties:
                  data:
                    type: object
                    required: [user, token]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
    CommentResult:
      description: Comentario público, sin metadatos privados
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/Comment' } }
    CommentPage:
      description: Página plana de comentarios, orden ascendente createdAt e id
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/CursorPage' }
                      - properties: { items: { type: array, items: { $ref: '#/components/schemas/Comment' } } }
    ReportResult:
      description: Sólo el reporte recién creado por el actor
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - properties: { data: { $ref: '#/components/schemas/Report' } }
    BadRequest:
      description: Body, params o query inválidos, o JSON malformado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 400
            error:
              message: 'Validation error: "email" is required'
    Unauthorized:
      description: Falta el token o es inválido o expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 401
            error:
              message: Authentication required
    Forbidden:
      description: El usuario no tiene el rol requerido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 403
            error:
              message: Insufficient permissions
    NotFound:
      description: El recurso o la ruta no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 404
            error:
              message: Route not found
    Conflict:
      description: Recurso duplicado (email, username o slug)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 409
            error:
              message: Email already in use
