openapi: 3.0.3
info:
  title: ModoFriki API
  version: 1.0.0
  description: >-
    Backend de la plataforma de cómics y manhwas ModoFriki. El contrato
    acordado con el frontend está en docs/API.md. Las respuestas OK tienen la
    forma { success, code, data } y los errores { success, code, error: { message } }.
servers:
  - url: /
tags:
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Estado del servidor
      responses:
        "200":
          description: Servidor activo
          content:
            application/json:
              schema:
                type: object
                required: [success, code, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    ErrorResponse:
      type: object
      required: [success, code, error]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: integer
          example: 404
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: Route not found
    PaginationMeta:
      type: object
      required: [total, page, limit]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
    Role:
      type: string
      enum: [USER, ADMIN]
    WorkType:
      type: string
      enum: [MANHWA, MANHUA, MANGA, NOVELA]
    WorkStatus:
      type: string
      enum: [ACTIVO, FINALIZADO, PAUSA]
    FavoriteStatus:
      type: string
      enum: [LEYENDO, POR_LEER, COMPLETADO, PAUSA]
  responses:
    BadRequest:
      description: Body, params o query inválidos, o JSON malformado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 400
            error:
              message: 'Validation error: "email" is required'
    Unauthorized:
      description: Falta el token o es inválido o expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 401
            error:
              message: Authentication required
    Forbidden:
      description: El usuario no tiene el rol requerido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 403
            error:
              message: Insufficient permissions
    NotFound:
      description: El recurso o la ruta no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 404
            error:
              message: Route not found
    Conflict:
      description: Recurso duplicado (email, username o slug)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: 409
            error:
              message: Email already in use
