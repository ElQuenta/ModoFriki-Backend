openapi: 3.0.3
info:
  title: ModoFriki API
  version: 1.0.0
  description: >-
    Backend de la plataforma de cómics y manhwas ModoFriki. El contrato
    acordado con el frontend está en docs/API.md. Las respuestas OK tienen la
    forma { success, code, data } y los errores { success, code, error: { message } }.
servers:
  - url: /
tags:
  - name: Health
paths:
  /api/works/{workId}/visits:
    post:
      tags:
        - Reading
      summary: Registrar visita a una obra publicada
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingEventInput"
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: UUID por operación, conservarlo al reintentar. Los GET no registran visitas.
  /api/works/{workId}/stats:
    get:
      tags:
        - Reading
      summary: Visitas y lecturas totales/24h, favoritos y valoración
      security: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingWorkStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/chapters/{chapterId}/read-events:
    post:
      tags:
        - Reading
      summary: Registrar lectura al entrar al capítulo y marcar leído
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingEventInput"
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: "Auth opcional. Registrado: evento y estado atómicos, máximo una contribución por capítulo/día
        local. Anónimo: solo evento. El frontend llama este POST al abrir el lector. La misma clave no se cuenta
        otra vez, incluso al día siguiente."
  /api/me/read-chapters/{chapterId}:
    put:
      tags:
        - Reading
      summary: Marcar capítulo leído previamente sin sumar actividad
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingReadState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: Incluye leídos antes de crear cuenta. Las fechas representan el registro del estado; no se crea
        evento ni se modifica la racha.
    delete:
      tags:
        - Reading
      summary: Desmarcar capítulo conservando actividad histórica
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Relación propia retirada; operación idempotente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me/favorites:
    get:
      tags:
        - Reading
      summary: Biblioteca personal de favoritos publicados
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingFavoritePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/me/favorites/{workId}:
    put:
      tags:
        - Reading
      summary: Añadir favorito idempotentemente
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingFavoriteStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Reading
      summary: Retirar favorito, incluso si la obra está oculta
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Relación propia retirada; operación idempotente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/works/{workId}/rating:
    put:
      tags:
        - Reading
      summary: Establecer valoración propia entre 0 y 5
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingRatingInput"
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Reading
      summary: Retirar valoración propia
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Relación propia retirada; operación idempotente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me/reading-history:
    get:
      tags:
        - Reading
      summary: Historial de capítulos actualmente marcados leídos
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/me/works/{workId}/progress:
    get:
      tags:
        - Reading
      summary: Favorito, valoración y progreso de capítulos publicados
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/me/reading-calendar:
    get:
      tags:
        - Reading
      summary: Calendario de actividad por día local, máximo 366 días
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingCalendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: Por defecto últimos 365 días. Conserva fechas locales históricas e incluye días sin actividad con cero.
  /api/me/reading-stats:
    get:
      tags:
        - Reading
      summary: Cantidad de lecturas y rachas actual/máxima
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/chapters/latest:
    get:
      tags:
        - Discovery
      summary: Últimos capítulos publicados (Novedades)
      description: >-
        Capítulos PUBLISHED y no eliminados de obras PUBLISHED y no eliminadas,
        ordenados por publishedAt descendente e id. Un typeId inexistente
        devuelve una página vacía. Se rechazan claves de query desconocidas.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: typeId
          in: query
          required: false
          description: UUID de /api/work-types
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LatestChapterPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario BASIC ACTIVE
      description: Password de 8 caracteres mínimo y 72 bytes UTF-8 máximo. Usuario 3 a 32 caracteres. Campos desconocidos rechazados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8 }
                timezone: { type: string, example: America/La_Paz }
      responses:
        '201': { $ref: '#/components/responses/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autenticar credenciales de usuario ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Identidad y rol vigentes desde PostgreSQL
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuario vigente
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/comments:
    get:
      tags: [Community]
      summary: Página plana de raíces, hijos directos o rama completa
      description: Un selector exacto targetType+targetId, parentCommentId o rootCommentId. Destino publicado. Bearer opcional, si se envía debe ser válido. Sin expansión recursiva.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: targetType, in: query, schema: { type: string, enum: [WORK, CHAPTER] } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: parentCommentId, in: query, schema: { type: string, format: uuid } }
        - { name: rootCommentId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CursorCreatedAt' }
        - { $ref: '#/components/parameters/CursorId' }
        - { $ref: '#/components/parameters/CursorLimit' }
      responses:
        '200': { $ref: '#/components/responses/CommentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Community]
      summary: Crear raíz o respuesta de cualquier profundidad
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [targetType, targetId, bodyMarkdown]
                  properties:
                    targetType: { type: string, enum: [WORK, CHAPTER] }
                    targetId: { type: string, format: uuid }
                    bodyMarkdown: { type: string, minLength: 1, maxLength: 10000 }
                - type: object
                  additionalProperties: false
                  required: [parentCommentId, bodyMarkdown]
                  properties:
                    parentCommentId: { type: string, format: uuid }
                    bodyMarkdown: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '201': { $ref: '#/components/responses/CommentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/comments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Community]
      summary: Editar comentario propio ACTIVE con revisión optimista
      description: La revisión también aumenta con respuestas, votos y reportes. Markdown debe renderizarse con sanitización.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bodyMarkdown, expectedRevision]
              properties:
                bodyMarkdown: { type: string, minLength: 1, maxLength: 10000 }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/CommentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Community]
      summary: Borrado lógico por autor o ADMIN, también en destinos ocultos
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Marcador conservado con bodyMarkdown null y descendientes intactos }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/comments/{id}/vote:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Community]
      summary: Establecer o sustituir voto propio
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties: { value: { type: integer, enum: [-1, 1] } }
      responses:
        '200':
          description: Conteo actual agregado desde votos independientes
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties:
                      data:
                        allOf:
                          - { $ref: '#/components/schemas/Votes' }
                          - properties: { commentId: { type: string, format: uuid } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Community]
      summary: Retirar voto, idempotente, admite comentario eliminado en destino publicado
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Voto ausente }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/comments/{id}/reports:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Community]
      summary: Reportar comentario ACTIVE, un reporte por usuario y comentario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [SPAM, HARASSMENT, HATE, SPOILER, OTHER] }
                details: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/ReportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/comment-reports:
    get:
      tags: [Community]
      summary: ADMIN lista reportes privados incluso de destinos ocultos
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] } }
        - { $ref: '#/components/parameters/CursorCreatedAt' }
        - { $ref: '#/components/parameters/CursorId' }
        - { $ref: '#/components/parameters/CursorLimit' }
      responses:
        '200':
          description: Página privada de moderación
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties:
                      data:
                        allOf:
                          - { $ref: '#/components/schemas/CursorPage' }
                          - properties: { items: { type: array, items: { $ref: '#/components/schemas/ModerationReport' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/comment-reports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Community]
      summary: ADMIN cierra reporte OPEN o IN_REVIEW, sin borrar automáticamente contenido
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, resolution]
              properties:
                status: { type: string, enum: [RESOLVED, DISMISSED] }
                resolution: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Reporte privado resuelto
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/ModerationReport' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /health:
    get:
      tags: [Health]
      summary: Estado del servidor
      responses:
        "200":
          description: Servidor activo
          content:
            application/json:
              schema:
                type: object
                required: [success, code, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: ok
  /api/works:
    get:
      tags:
        - Catalog
      summary: Listar obras publicadas; includeDrafts requiere personal autorizado
