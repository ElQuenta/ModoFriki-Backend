        '200': { $ref: '#/components/responses/CommentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Community]
      summary: Crear raíz o respuesta de cualquier profundidad
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: UUID v4 opcional; misma solicitud reproduce el comentario actual, otra solicitud con la misma clave devuelve 409.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [targetType, targetId, bodyMarkdown]
                  properties:
                    targetType: { type: string, enum: [WORK, CHAPTER] }
                    targetId: { type: string, format: uuid }
                    bodyMarkdown: { type: string, minLength: 1, maxLength: 10000 }
                - type: object
                  additionalProperties: false
                  required: [parentCommentId, bodyMarkdown]
                  properties:
                    parentCommentId: { type: string, format: uuid }
                    bodyMarkdown: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '201': { $ref: '#/components/responses/CommentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/comments/{id}:
