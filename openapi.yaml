        slug:
          type: string
        title:
          type: string
        coverUrl:
          type: string
          nullable: true
        thumbUrl:
          type: string
          nullable: true
          description: Miniatura WebP de 300 px para tarjetas; null hasta que corre media:thumbnails (usar coverUrl).
    LatestChapter:
      type: object
      required: [id, workId, number, title, kind, publishedAt, work]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        number:
          type: string
          description: Decimal serializado
        title:
          type: string
          nullable: true
        kind:
          type: string
          enum: [NORMAL, EXTRA, ANNOUNCEMENT]
        publishedAt:
          type: string
