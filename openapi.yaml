openapi: 3.0.3
info:
  title: ModoFriki API
  version: 1.0.0
  description: >-
    Backend de la plataforma de cómics y manhwas ModoFriki. El contrato
    acordado con el frontend está en docs/API.md. Las respuestas OK tienen la
    forma { success, code, data } y los errores { success, code, error: { message } }.
servers:
  - url: /
tags:
  - name: Health
  - name: Admin
paths:
  /api/admin/users:
    get:
      tags: [Admin]
      summary: Listar cuentas administrables
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { name: cursorCreatedAt, in: query, schema: { type: string, format: date-time } }
        - { name: cursorId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: '#/components/responses/AdminUserPage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
      description: cursorCreatedAt y cursorId deben enviarse juntos. Excluye cuentas eliminadas y datos privados.
  /api/admin/users/{userId}:
    get:
      tags: [Admin]
      summary: Obtener cuenta y token CAS actual
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        "200": { $ref: '#/components/responses/AdminUserResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/users/{userId}/role:
    patch:
      tags: [Admin]
      summary: Cambiar rol BASIC o EDITOR
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, expectedUpdatedAt]
              properties:
                role: { type: string, enum: [BASIC, EDITOR] }
                expectedUpdatedAt: { type: string, format: date-time, example: '2026-10-30T12:00:00.000Z' }
      responses:
        "200": { $ref: '#/components/responses/AdminUserResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
      description: La degradación a BASIC revoca y audita atómicamente todas las asignaciones activas.
  /api/admin/users/{userId}/work-assignments:
    get:
      tags: [Admin]
      summary: Listar asignaciones editoriales
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: includeRevoked, in: query, schema: { type: boolean, default: false } }
        - { name: cursorCreatedAt, in: query, schema: { type: string, format: date-time } }
        - { name: cursorId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: '#/components/responses/AdminAssignmentPage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/users/{userId}/work-assignments/{workId}:
    put:
      tags: [Admin]
      summary: Asignar editor activo a una obra
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminWorkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: '#/components/responses/AdminAssignmentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
  /api/admin/users/{userId}/work-assignments/{workId}/revocation:
    patch:
      tags: [Admin]
      summary: Revocar asignación editorial
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
        - $ref: '#/components/parameters/AdminWorkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: '#/components/responses/AdminAssignmentResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }
  /api/works/{workId}/visits:
    post:
      tags:
        - Reading
      summary: Registrar visita a una obra publicada
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingEventInput"
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: UUID por operación, conservarlo al reintentar. Los GET no registran visitas.
  /api/works/{workId}/stats:
    get:
      tags:
        - Reading
      summary: Visitas y lecturas totales/24h, favoritos y valoración
      security: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingWorkStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/chapters/{chapterId}/read-events:
    post:
      tags:
        - Reading
      summary: Registrar lectura al entrar al capítulo y marcar leído
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingEventInput"
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: "Auth opcional. Registrado: evento y estado atómicos, máximo una contribución por capítulo/día
        local. Anónimo: solo evento. El frontend llama este POST al abrir el lector. La misma clave no se cuenta
        otra vez, incluso al día siguiente."
  /api/me/read-chapters/{chapterId}:
    put:
      tags:
        - Reading
      summary: Marcar capítulo leído previamente sin sumar actividad
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingReadState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: Incluye leídos antes de crear cuenta. Las fechas representan el registro del estado; no se crea
        evento ni se modifica la racha.
    delete:
      tags:
        - Reading
      summary: Desmarcar capítulo conservando actividad histórica
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Relación propia retirada; operación idempotente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me/favorites:
    get:
      tags:
        - Reading
      summary: Biblioteca personal de favoritos publicados
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingFavoritePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/me/favorites/{workId}:
    put:
      tags:
        - Reading
      summary: Añadir favorito idempotentemente
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingFavoriteStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Reading
      summary: Retirar favorito, incluso si la obra está oculta
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Relación propia retirada; operación idempotente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/works/{workId}/rating:
    put:
      tags:
        - Reading
      summary: Establecer valoración propia entre 0 y 5
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingRatingInput"
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Reading
      summary: Retirar valoración propia
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Relación propia retirada; operación idempotente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me/reading-history:
    get:
      tags:
        - Reading
      summary: Historial de capítulos actualmente marcados leídos
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/me/works/{workId}/progress:
    get:
      tags:
        - Reading
      summary: Favorito, valoración y progreso de capítulos publicados
      security:
        - bearerAuth: []
      parameters:
        - name: workId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/me/reading-calendar:
    get:
      tags:
        - Reading
      summary: Calendario de actividad por día local, máximo 366 días
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingCalendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      description: Por defecto últimos 365 días. Conserva fechas locales históricas e incluye días sin actividad con cero.
  /api/me/reading-stats:
    get:
      tags:
        - Reading
      summary: Cantidad de lecturas y rachas actual/máxima
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/chapters/latest:
    get:
      tags:
        - Discovery
      summary: Últimos capítulos publicados (Novedades)
      description: >-
        Capítulos PUBLISHED y no eliminados de obras PUBLISHED y no eliminadas,
        ordenados por publishedAt descendente e id. Un typeId inexistente
        devuelve una página vacía. Se rechazan claves de query desconocidas.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: typeId
          in: query
          required: false
          description: UUID de /api/work-types
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LatestChapterPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/works/popular:
    get:
      tags:
        - Discovery
      summary: Obras más visitadas (Populares)
      description: >-
        Todas las obras PUBLISHED y no eliminadas, también con 0 visitas,
        ordenadas por visits descendente, publishedAt descendente e id.
        period=day cuenta las visitas de las últimas 24 horas. Un typeId
        inexistente devuelve una página vacía. Se rechazan claves de query
        desconocidas.
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [all, day]
            default: all
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: typeId
          in: query
          required: false
          description: UUID de /api/work-types
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PopularWorkPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/works/recommended:
    get:
      tags:
        - Discovery
      summary: Obras recomendadas por géneros de favoritos
      description: >-
        Pública con Bearer opcional; si se envía, debe ser válido. Con sesión
        excluye los favoritos del usuario y ordena las obras PUBLISHED y no
        eliminadas por géneros coincidentes descendente, luego como popular
        (period=all). basis es genres si el usuario tiene al menos un favorito
        con géneros; si no, o sin sesión, popular. El id sale del token; se
        rechazan claves de query desconocidas (incluida userId).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RecommendedWorks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario BASIC ACTIVE
      description: Password de 8 caracteres mínimo y 72 bytes UTF-8 máximo. Usuario 3 a 32 caracteres. Campos desconocidos rechazados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8 }
                timezone: { type: string, example: America/La_Paz }
      responses:
        '201': { $ref: '#/components/responses/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autenticar credenciales de usuario ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Identidad y rol vigentes desde PostgreSQL
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuario vigente
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/comments:
    get:
      tags: [Community]
      summary: Página plana de raíces, hijos directos o rama completa
      description: Un selector exacto targetType+targetId, parentCommentId o rootCommentId. Destino publicado. Bearer opcional, si se envía debe ser válido. Sin expansión recursiva.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: targetType, in: query, schema: { type: string, enum: [WORK, CHAPTER] } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: parentCommentId, in: query, schema: { type: string, format: uuid } }
        - { name: rootCommentId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CursorCreatedAt' }
        - { $ref: '#/components/parameters/CursorId' }
        - { $ref: '#/components/parameters/CursorLimit' }
