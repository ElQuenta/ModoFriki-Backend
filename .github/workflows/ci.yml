name: CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tipos, unit tests y build
    runs-on: ubuntu-latest
    env:
      # Solo para que prisma.config.ts resuelva env("DATABASE_URL"); estos pasos no se conectan.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  api:
    name: Integración y API (Postgres + Mongo desechables)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Levanta docker-compose.test.yml, migra, seed y carga postman/fixtures (nunca Render).
      - name: Entorno de pruebas
        run: npm run test:env:up
      - name: Tests de integración
        run: npm run test:integration
      - name: Backend en segundo plano
        run: |
          npm run test:env:server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Colección Postman (newman)
        run: npm run test:api
      - name: Reporte de newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: postman/reports/last-run.json
          if-no-files-found: ignore
      - name: Log del servidor
        if: failure()
        run: cat server.log || true
